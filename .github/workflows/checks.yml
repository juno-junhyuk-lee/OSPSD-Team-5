name: Checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CALENDAR_LIVE_CONFORMANCE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: |
          uv run mypy
          uv run mypy scripts/deploy_release.py
      - name: Test
        run: uv run pytest --ignore=tests/test_shared_conformance.py
      - name: Shared conformance (controlled provider)
        run: >-
          uv run pytest -v
          tests/test_shared_conformance.py::TestGoogleCalendarServiceConformance

  infrastructure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [infra, infra/ci]
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - name: Check Terraform formatting
        run: terraform -chdir=${{ matrix.directory }} fmt -check -recursive
      - name: Initialize Terraform without remote state
        run: terraform -chdir=${{ matrix.directory }} init -backend=false -input=false -lockfile=readonly
      - name: Validate Terraform
        run: terraform -chdir=${{ matrix.directory }} validate -no-color
      - name: Test deployment access boundaries
        if: matrix.directory == 'infra/ci'
        run: terraform -chdir=infra/ci test -no-color
