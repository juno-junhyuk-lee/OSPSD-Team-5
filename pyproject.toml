[project]
name = "ospssd-team-5"
version = "0.1.0"
description = "Team 5 calendar service for CS 3943 OSPSD"
requires-python = ">=3.14"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "ast-serialize==0.12.1",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "colorama==0.4.6",
    "cryptography==50.0.2",
    "fastapi==0.142.2",
    "google-api-core==2.40.0",
    "google-api-python-client==2.201.0",
    "google-auth==2.59.1",
    "google-auth-httplib2==0.4.4",
    "google-auth-oauthlib==1.5.0",
    "googleapis-common-protos==1.75.5",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httplib2==0.32.0",
    "httpx==0.28.1",
    "idna==3.20",
    "iniconfig==2.3.0",
    "librt==0.16.0",
    "mypy==2.4.0",
    "mypy-extensions==1.1.0",
    "oauthlib==4.0.0",
    "opentelemetry-api==1.45.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "proto-plus==1.29.0",
    "protobuf==7.36.2",
    "pyasn1==0.6.4",
    "pyasn1-modules==0.4.2",
    "pycparser==3.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pygments==2.21.0",
    "pyparsing==3.3.3",
    "pytest==9.1.1",
    "requests==2.34.2",
    "requests-oauthlib==2.0.0",
    "ruff==0.16.10",
    "starlette==1.7.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uritemplate==4.2.0",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["app", "tests"]
strict = true
untyped_calls_exclude = ["google.oauth2.credentials", "google.auth.exceptions"]
